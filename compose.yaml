services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: shipboard
      POSTGRES_PASSWORD: shipboard
      POSTGRES_DB: shipboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipboard -d shipboard"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
