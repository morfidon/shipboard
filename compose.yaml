services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: shipboard
      POSTGRES_PASSWORD: shipboard
      POSTGRES_DB: shipboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipboard -d shipboard"]
      interval: 2s
      timeout: 5s
      retries: 30

  # A second database only for tests. Tests delete data, so they never touch the one above.
  db-test:
    image: postgres:18
    environment:
      POSTGRES_USER: shipboard
      POSTGRES_PASSWORD: shipboard
      POSTGRES_DB: shipboard_test
    ports:
      - "127.0.0.1:5433:5432"
    # Kept in memory: fast, and empty again after every restart.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipboard -d shipboard_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Files, in an S3-compatible store (RustFS). Made-up local keys; in
  # production the same code talks to Cloudflare R2 or AWS S3.
  storage:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: shipboard
      RUSTFS_SECRET_KEY: shipboard-storage
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - storage:/data

volumes:
  pgdata:
  storage:
