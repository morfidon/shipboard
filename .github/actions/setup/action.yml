name: Set up
description: pnpm, Node.js with the pnpm cache, and our packages.

runs:
  using: composite
  steps:
    # pnpm, in the version package.json asks for.
    - uses: pnpm/action-setup@v6
    # Node.js 26, and our packages kept between runs.
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
