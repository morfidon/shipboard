name: CI

# When it runs: every push to main, and every pull request.
on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads our code.
permissions:
  contents: read

# A new push to a pull request cancels its run that's still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two values the app reads when it's built and started. On our machine
# they come from .env, which Git never sees. Made up, like the keys in
# .env.test: nothing outside this runner trusts them.
env:
  BETTER_AUTH_SECRET: made-up-for-ci-only-never-a-real-secret
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test --project unit --project components

  integration:
    runs-on: ubuntu-latest
    # A Postgres next to the job, like db-test in compose.yaml.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shipboard
          POSTGRES_PASSWORD: shipboard
          POSTGRES_DB: shipboard_test
        # Port 5433 on the runner leads to 5432 in the container:
        # the address .env.test gives our tests.
        ports:
          - 5433:5432
        # The steps wait until Postgres answers on that port.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U shipboard -d shipboard_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test --project integration
      - run: pnpm test:production

  e2e:
    runs-on: ubuntu-latest
    # The same Postgres as the integration job. Our e2e setup makes a
    # seeded database on it, and a copy for each worker.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shipboard
          POSTGRES_PASSWORD: shipboard
          POSTGRES_DB: shipboard_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U shipboard -d shipboard_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Chromium, and the system libraries it needs on Ubuntu.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # The report, with a trace of every retried test. Uploaded when tests
      # fail too: that's when we need it most.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14

  migrations:
    runs-on: ubuntu-latest
    # Its own Postgres, named like the one on our machine.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shipboard
          POSTGRES_PASSWORD: shipboard
          POSTGRES_DB: shipboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U shipboard -d shipboard"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://shipboard:shipboard@localhost:5432/shipboard
    steps:
      # The whole history, so we can reach main as it was.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # With shell: bash, a failing pnpm inside the pipe fails the step too.
      - name: Every schema change has its migration
        shell: bash
        run: |
          pnpm db:generate | tee "$RUNNER_TEMP/generate.log"
          grep -q "No schema changes, nothing to migrate" "$RUNNER_TEMP/generate.log"
          test -z "$(git status --porcelain -- drizzle)"

      # In a pull request, HEAD is the merge of our branch into main, and
      # HEAD^1 is main as it was. A changed, renamed or deleted SQL file fails.
      - name: Migrations that already ran stay as they are
        if: github.event_name == 'pull_request'
        run: git diff --no-renames --exit-code --diff-filter=MDT HEAD^1 HEAD -- 'drizzle/*.sql'

      - name: The database as main has it, with data in it
        if: github.event_name == 'pull_request'
        run: |
          git worktree add --detach "$RUNNER_TEMP/main" HEAD^1
          cd "$RUNNER_TEMP/main"
          pnpm install --frozen-lockfile
          pnpm db:migrate
          node db/seed.ts

      - name: Our migrations, on top of it
        run: pnpm db:migrate
