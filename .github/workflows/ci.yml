name: CI

# When it runs: every push to main, and every pull request.
on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads our code.
permissions:
  contents: read

# A new push to a pull request cancels its run that's still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two values the app reads when it's built and started. On our machine
# they come from .env, which Git never sees. Made up, like the keys in
# .env.test: nothing outside this runner trusts them.
env:
  BETTER_AUTH_SECRET: made-up-for-ci-only-never-a-real-secret
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test --project unit --project components

  integration:
    runs-on: ubuntu-latest
    # A Postgres next to the job, like db-test in compose.yaml.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shipboard
          POSTGRES_PASSWORD: shipboard
          POSTGRES_DB: shipboard_test
        # Port 5433 on the runner leads to 5432 in the container:
        # the address .env.test gives our tests.
        ports:
          - 5433:5432
        # The steps wait until Postgres answers on that port.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U shipboard -d shipboard_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test --project integration
      - run: pnpm test:production

  e2e:
    runs-on: ubuntu-latest
    # Two machines, each with half of the tests. A failing half
    # doesn't stop the other one.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # The same Postgres as the integration job. Our e2e setup makes a
    # seeded database on it, and a copy for each worker.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shipboard
          POSTGRES_PASSWORD: shipboard
          POSTGRES_DB: shipboard_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U shipboard -d shipboard_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Chromium, and the system libraries it needs on Ubuntu.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/2
      # This half's results, for the job below to merge.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # One HTML report from both halves.
  e2e-report:
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14
