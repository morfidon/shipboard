name: CI

# When it runs: every push to main, and every pull request.
on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads our code.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm, in the version package.json asks for.
      - uses: pnpm/action-setup@v6
      # Node.js 26, and our packages kept between runs.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
